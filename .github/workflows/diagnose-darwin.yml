name: Observe ordinary Darwin checks with one Nix job

on:
  push:
    branches: [dev-1073-diagnose-darwin-materialization]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Create scoped evidence directory
        id: evidence
        run: mkdir -p "${{ runner.temp }}/dev1073-darwin-diagnostic"

      - name: Company Nix setup and diagnostic checkout
        id: setup
        uses: Cambridge-Vision-Technology/ci/setup@aa5e3d4010883a2796cc1f32a826f2cad6c4e3ac
        with:
          enable-org-read-access: false
          enable-ssh-agent: false
          enable-lfs: false
          checkout: true
          fetch-depth: '0'

      - name: Preserve the diagnostic workflow before selecting tested source
        id: commands
        run: /bin/cp .github/workflows/diagnose-darwin.yml "${{ runner.temp }}/dev1073-darwin-diagnostic/diagnose-darwin.yml"

      - name: Record diagnostic workflow commit and tree in that order
        id: workflow_identity
        run: git rev-parse HEAD 'HEAD^{tree}' > "${{ runner.temp }}/dev1073-darwin-diagnostic/workflow-identity.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/workflow-identity.stderr"

      - name: Select exact maintained source after the setup internal checkout
        id: select_source
        run: git checkout --detach 01ed5fa900d27ca11c5343a0ed96c68dab98b7be > "${{ runner.temp }}/dev1073-darwin-diagnostic/source-selection.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/source-selection.stderr"

      - name: Record actual tested checkout commit and tree in that order
        id: tested_identity
        run: git rev-parse HEAD 'HEAD^{tree}' > "${{ runner.temp }}/dev1073-darwin-diagnostic/tested-identity.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/tested-identity.stderr"

      - name: Enforce the Nix floor without a fallback
        id: nix_floor
        run: nix eval --raw --expr 'assert builtins.compareVersions builtins.nixVersion "2.35.0" >= 0; builtins.nixVersion' > "${{ runner.temp }}/dev1073-darwin-diagnostic/nix-floor.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/nix-floor.stderr"

      - name: Record only ordinary maintained checks and original producer declarations without building
        id: declaration
        run: |
          nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              checks = flake.checks.x86_64-darwin;
              package = flake.packages.x86_64-darwin.purs-backend-es;
              workspace = checks.build.src;
              runtime = package.runtime;
              identity = value: { drv = value.drvPath; out = value.outPath; };
              declaration = value: identity value // { inherit (value) system builder args buildCommand; };
            in
            assert builtins.currentSystem == "x86_64-darwin";
            assert builtins.attrNames checks == [ "actionlint" "build" "format" "output-diff" "snapshots" "test-implementation" ];
            assert builtins.attrNames flake.devShells.x86_64-darwin == [ "default" ];
            assert workspace.drvPath == "/nix/store/gxsnb1ijlh13ajc4daz1rgp6g9hg75vh-backend-es-check-workspace.drv";
            assert workspace.outPath == "/nix/store/ikgclz97jpz52jy6fml1ivykv2kjnxdm-backend-es-check-workspace";
            assert runtime.drvPath == "/nix/store/63h620l1ix5lx3ijm77mpncd7m6v2f42-purs-backend-es-runtime-1.4.3.drv";
            assert runtime.outPath == "/nix/store/msby1pbc9vxqhaa5v1x17dm4div23ijl-purs-backend-es-runtime-1.4.3";
            {
              workflowRef = "${{ github.ref }}";
              workflowSha = "${{ github.sha }}";
              testedRef = "detached literal maintained commit";
              testedSha = "01ed5fa900d27ca11c5343a0ed96c68dab98b7be";
              checkoutReceiptOrder = [ "commit" "tree" ];
              runId = "${{ github.run_id }}";
              runAttempt = "${{ github.run_attempt }}";
              setup = "Cambridge-Vision-Technology/ci/setup@aa5e3d4010883a2796cc1f32a826f2cad6c4e3ac";
              primaryCommand = "nix flake check --verbose --max-jobs 1";
              shellCommand = "nix develop --command true";
              jobDeadlineMinutes = 60;
              normalScenarioDeadlineMilliseconds = 60000;
              flakeSource = flake.outPath;
              productionSource = toString package.source;
              production = identity package;
              compiled = identity package.compiled;
              originalWorkspace = declaration workspace;
              runtime = declaration runtime;
              ordinaryChecks = builtins.mapAttrs (_: identity) checks;
              tools = builtins.mapAttrs (_: identity) package.tools;
              nixpkgs = { inherit (flake.inputs.nixpkgs) rev outPath; };
            }
          ' > "${{ runner.temp }}/dev1073-darwin-diagnostic/declaration.json" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/declaration.stderr"

      - name: Record Nix client version
        id: nix_version
        continue-on-error: true
        run: nix --version > "${{ runner.temp }}/dev1073-darwin-diagnostic/nix-version.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/nix-version.stderr"

      - name: Record the native host system
        id: host_system
        continue-on-error: true
        run: /usr/bin/uname -sm > "${{ runner.temp }}/dev1073-darwin-diagnostic/host-system.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/host-system.stderr"

      - name: Snapshot Nix daemon PIDs before checks without arguments
        id: daemon_before
        continue-on-error: true
        run: /usr/bin/pgrep -l -x nix-daemon > "${{ runner.temp }}/dev1073-darwin-diagnostic/daemon-before.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/daemon-before.stderr"

      - name: Snapshot exact original builder PIDs before checks without arguments
        id: builder_before
        continue-on-error: true
        run: /usr/bin/pgrep -f '^/nix/store/(6sfr9nl8la7j1311dg61wz9dk0q3gxgk-bash-5\.3p3/bin/bash|m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9\.8/bin/(cp|coreutils))( |$)' > "${{ runner.temp }}/dev1073-darwin-diagnostic/builder-before.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/builder-before.stderr"

      - name: Observe memory before checks without pressure or simulation flags
        id: memory_before
        continue-on-error: true
        run: /usr/bin/memory_pressure > "${{ runner.temp }}/dev1073-darwin-diagnostic/memory-before.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/memory-before.stderr"

      - name: Open primary check UTC window
        id: primary_start
        run: |
          /bin/date -u '+start=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/primary-window-start.txt"

      - name: Run all ordinary maintained checks with only one Nix job
        id: primary
        run: /usr/bin/time -l -o "${{ runner.temp }}/dev1073-darwin-diagnostic/primary-client-time-rusage.txt" nix flake check --verbose --max-jobs 1 > "${{ runner.temp }}/dev1073-darwin-diagnostic/primary.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/primary.stderr"

      - name: Close primary UTC window even after failure
        id: primary_end
        if: ${{ always() && steps.primary_start.outcome == 'success' }}
        run: |
          /bin/date -u -v+1S '+end=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/primary-window-end.txt"

      - name: Open default shell UTC window only after primary success
        id: shell_start
        if: ${{ !cancelled() && steps.primary.outcome == 'success' }}
        run: |
          /bin/date -u '+start=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/shell-window-start.txt"

      - name: Validate the ordinary default shell only after primary success
        id: shell
        if: ${{ !cancelled() && steps.primary.outcome == 'success' && steps.shell_start.outcome == 'success' }}
        run: /usr/bin/time -l -o "${{ runner.temp }}/dev1073-darwin-diagnostic/shell-client-time-rusage.txt" nix develop --command true > "${{ runner.temp }}/dev1073-darwin-diagnostic/shell.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/shell.stderr"

      - name: Close default shell UTC window even after shell failure
        id: shell_end
        if: ${{ always() && steps.shell_start.outcome == 'success' }}
        run: |
          /bin/date -u -v+1S '+end=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/shell-window-end.txt"

      - name: Snapshot Nix daemon PIDs after checks without arguments
        id: daemon_after
        if: ${{ always() && steps.primary_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/pgrep -l -x nix-daemon > "${{ runner.temp }}/dev1073-darwin-diagnostic/daemon-after.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/daemon-after.stderr"

      - name: Snapshot exact original builder PIDs after checks without arguments
        id: builder_after
        if: ${{ always() && steps.primary_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/pgrep -f '^/nix/store/(6sfr9nl8la7j1311dg61wz9dk0q3gxgk-bash-5\.3p3/bin/bash|m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9\.8/bin/(cp|coreutils))( |$)' > "${{ runner.temp }}/dev1073-darwin-diagnostic/builder-after.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/builder-after.stderr"

      - name: Observe memory after checks without pressure or simulation flags
        id: memory_after
        if: ${{ always() && steps.primary_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/memory_pressure > "${{ runner.temp }}/dev1073-darwin-diagnostic/memory-after.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/memory-after.stderr"

      - name: Read only exact original target and executable related records in the primary window
        id: termination_log
        if: ${{ always() && steps.primary_start.outcome == 'success' && steps.primary_end.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: >-
          /usr/bin/log show --style json --timezone UTC --info --debug
          --start '${{ steps.primary_start.outputs.start }}' --end '${{ steps.primary_end.outputs.end }}'
          --predicate '(process IN {"kernel", "amfid", "syspolicyd", "taskgated", "taskgated-helper"}) AND (eventMessage CONTAINS[c] "/nix/store/m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9.8/bin/cp" OR eventMessage CONTAINS[c] "/nix/store/m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9.8/bin/coreutils" OR eventMessage CONTAINS[c] "/nix/store/6sfr9nl8la7j1311dg61wz9dk0q3gxgk-bash-5.3p3/bin/bash" OR eventMessage CONTAINS[c] "gxsnb1ijlh13ajc4daz1rgp6g9hg75vh-backend-es-check-workspace" OR eventMessage CONTAINS[c] "ikgclz97jpz52jy6fml1ivykv2kjnxdm-backend-es-check-workspace" OR eventMessage CONTAINS[c] "63h620l1ix5lx3ijm77mpncd7m6v2f42-purs-backend-es-runtime" OR eventMessage CONTAINS[c] "msby1pbc9vxqhaa5v1x17dm4div23ijl-purs-backend-es-runtime")'
          > "${{ runner.temp }}/dev1073-darwin-diagnostic/termination-security.json"
          2> "${{ runner.temp }}/dev1073-darwin-diagnostic/termination-security.stderr"

      - name: Retrieve original workspace log without rebuilding after primary attempt
        id: workspace_log
        if: ${{ always() && (steps.primary.outcome == 'success' || steps.primary.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 2
        run: nix log /nix/store/gxsnb1ijlh13ajc4daz1rgp6g9hg75vh-backend-es-check-workspace.drv > "${{ runner.temp }}/dev1073-darwin-diagnostic/workspace-build.log" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/workspace-build-log.stderr"

      - name: Retrieve original runtime log independently without rebuilding
        id: runtime_log
        if: ${{ always() && (steps.primary.outcome == 'success' || steps.primary.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 2
        run: nix log /nix/store/63h620l1ix5lx3ijm77mpncd7m6v2f42-purs-backend-es-runtime-1.4.3.drv > "${{ runner.temp }}/dev1073-darwin-diagnostic/runtime-build.log" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/runtime-build-log.stderr"

      - name: Retain original workspace output registration or raw absence without rebuilding
        id: workspace_info
        if: ${{ always() && (steps.primary.outcome == 'success' || steps.primary.outcome == 'failure') }}
        continue-on-error: true
        run: nix path-info --json --json-format 2 /nix/store/ikgclz97jpz52jy6fml1ivykv2kjnxdm-backend-es-check-workspace > "${{ runner.temp }}/dev1073-darwin-diagnostic/workspace-path-info.json" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/workspace-path-info.stderr"

      - name: Retain original runtime output registration independently or raw absence
        id: runtime_info
        if: ${{ always() && (steps.primary.outcome == 'success' || steps.primary.outcome == 'failure') }}
        continue-on-error: true
        run: nix path-info --json --json-format 2 /nix/store/msby1pbc9vxqhaa5v1x17dm4div23ijl-purs-backend-es-runtime-1.4.3 > "${{ runner.temp }}/dev1073-darwin-diagnostic/runtime-path-info.json" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/runtime-path-info.stderr"

      - name: Retain independent raw outcomes and explicit missing or skipped shell semantics
        id: outcomes
        if: ${{ always() && steps.evidence.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          nix eval --json --expr '{
            workflowRef = "${{ github.ref }}";
            workflowSha = "${{ github.sha }}";
            testedRef = "detached literal maintained commit";
            testedSha = "01ed5fa900d27ca11c5343a0ed96c68dab98b7be";
            setup = "${{ steps.setup.outcome }}";
            commands = "${{ steps.commands.outcome }}";
            workflowIdentity = "${{ steps.workflow_identity.outcome }}";
            sourceSelection = "${{ steps.select_source.outcome }}";
            testedIdentity = "${{ steps.tested_identity.outcome }}";
            nixFloor = "${{ steps.nix_floor.outcome }}";
            declaration = "${{ steps.declaration.outcome }}";
            nixVersion = "${{ steps.nix_version.outcome }}";
            hostSystem = "${{ steps.host_system.outcome }}";
            primary = "${{ steps.primary.outcome }}";
            primaryCommand = "nix flake check --verbose --max-jobs 1";
            primaryStart = "${{ steps.primary_start.outputs.start }}";
            primaryStartOutcome = "${{ steps.primary_start.outcome }}";
            primaryEnd = "${{ steps.primary_end.outputs.end }}";
            primaryEndOutcome = "${{ steps.primary_end.outcome }}";
            shell = "${{ steps.shell.outcome }}";
            shellCommand = "nix develop --command true";
            shellStart = "${{ steps.shell_start.outputs.start }}";
            shellStartOutcome = "${{ steps.shell_start.outcome }}";
            shellEnd = "${{ steps.shell_end.outputs.end }}";
            shellEndOutcome = "${{ steps.shell_end.outcome }}";
            daemonBefore = "${{ steps.daemon_before.outcome }}";
            daemonAfter = "${{ steps.daemon_after.outcome }}";
            builderBefore = "${{ steps.builder_before.outcome }}";
            builderAfter = "${{ steps.builder_after.outcome }}";
            memoryBefore = "${{ steps.memory_before.outcome }}";
            memoryAfter = "${{ steps.memory_after.outcome }}";
            terminationSecurityLog = "${{ steps.termination_log.outcome }}";
            workspaceBuildLog = "${{ steps.workspace_log.outcome }}";
            runtimeBuildLog = "${{ steps.runtime_log.outcome }}";
            workspaceInfo = "${{ steps.workspace_info.outcome }}";
            runtimeInfo = "${{ steps.runtime_info.outcome }}";
            jobDeadlineMinutes = 60;
            normalScenarioDeadlineMilliseconds = 60000;
            limits = [
              "workflow-identity and tested-identity record actual commit then tree separately; workflow ref is not the tested detached source"
              "shell skipped or missing outcome (empty string), absent files and empty UTC fields are incomplete evidence, never shell success"
              "GitHub step logs retain numeric exit codes; time forwards the utility status without printing a numeric status field"
              "primary and shell have no continue-on-error; collectors and partial upload cannot turn their failure green"
              "normal Nix substitution remains enabled; stderr and exact logs must establish fresh target execution versus reuse or prerequisite failure"
              "registered output metadata does not prove fresh execution in this run; missing target logs are not permission to rebuild"
              "client time and rusage include evaluation, transfers and dependencies, not daemon-builder or copy peak RSS or OOM proof"
              "before and after PID or host memory snapshots are not an execution trace or process peak and cannot identify a dead builder"
              "pgrep status 1 means no matching live PID; denied, unsupported, missing and empty records remain limitations, not a cause"
              "primary UTC bounds have whole-second precision with end advanced one second; clock changes, ingestion delay and overlapping activity limit correlation"
              "OS log predicate selects only exact original targets or executable identities; no broad host log or environment/configuration dump is collected"
              "native collectors have no byte/count cap; setup failure, cancellation, host loss or the 60-minute job cap can prevent outcomes or upload"
              "no alternative build, comparison-tool acquisition, version-probe product realization or prebuild precedes the primary"
              "this diagnostic is not a maintained repair, termination-cause proof or ordinary supported-platform acceptance"
            ];
          }' > "${{ runner.temp }}/dev1073-darwin-diagnostic/outcomes-and-limits.json" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/outcomes-and-limits.stderr"

      - name: Require both ordinary check and default shell success without masking failure
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: nix eval --json --expr 'assert "${{ steps.primary.outcome }}" == "success"; assert "${{ steps.shell.outcome }}" == "success"; true' > "${{ runner.temp }}/dev1073-darwin-diagnostic/required-outcomes.json" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/required-outcomes.stderr"

      - name: Upload only scoped partial diagnostic files including failures
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dev1073-darwin-scheduling-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dev1073-darwin-diagnostic/diagnose-darwin.yml
            ${{ runner.temp }}/dev1073-darwin-diagnostic/workflow-identity.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/source-selection.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/tested-identity.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/declaration.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/nix-floor.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/nix-version.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/host-system.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/primary.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/primary-*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/shell.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/shell-*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/daemon-*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/builder-*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/memory-*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/termination-security.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/workspace-build*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/runtime-build*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/workspace-path-info.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/runtime-path-info.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/outcomes-and-limits.*
            ${{ runner.temp }}/dev1073-darwin-diagnostic/required-outcomes.*
          if-no-files-found: error
          retention-days: 7
