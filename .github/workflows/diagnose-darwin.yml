          > "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-input-parity.json" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-input-parity.stderr"

      - name: Retain build and collector outcomes and measurement limits
        if: ${{ always() && steps.evidence.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          nix eval --json --expr '{
