name: Compare Darwin workspace materialization

on:
  push:
    branches: [dev-1073-diagnose-darwin-materialization]

permissions:
  contents: read

jobs:
  materialize:
    runs-on: macos-15-intel
    steps:
      - name: Create scoped evidence directory
        id: evidence
        run: mkdir -p "${{ runner.temp }}/dev1073-darwin-diagnostic"

      - name: Company Nix setup
        id: setup
        uses: Cambridge-Vision-Technology/ci/setup@aa5e3d4010883a2796cc1f32a826f2cad6c4e3ac
        with:
          enable-org-read-access: false
          enable-ssh-agent: false
          enable-lfs: false
          checkout: true
          fetch-depth: '0'

      - name: Retain the exact workflow commands
        id: commands
        run: /bin/cp .github/workflows/diagnose-darwin.yml "${{ runner.temp }}/dev1073-darwin-diagnostic/diagnose-darwin.yml"

      - name: Enforce the Nix floor without a fallback
        id: nix_floor
        run: nix eval --raw --expr 'assert builtins.compareVersions builtins.nixVersion "2.35.0" >= 0; builtins.nixVersion' > "${{ runner.temp }}/dev1073-darwin-diagnostic/nix-floor.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/nix-floor.stderr"

      - name: Record source and exact independent immutable declarations
        id: declaration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.nix_floor.outcome == 'success' }}
        run: |
          nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              packages = flake.packages.x86_64-darwin;
              pkgs = import flake.inputs.nixpkgs { system = "x86_64-darwin"; };
              workspace = packages.diagnose-darwin-workspace;
              runtime = packages.diagnose-darwin-runtime;
              alternative = packages.diagnose-workspace-rsync;
              layout = packages.diagnose-workspace-layout;
              identity = value: { drv = value.drvPath; out = value.outPath; };
              declaration = value: identity value // { inherit (value) system builder args buildCommand; };
            in
            assert builtins.currentSystem == "x86_64-darwin";
            assert flake.rev == "${{ github.sha }}";
            assert workspace.drvPath == "/nix/store/gxsnb1ijlh13ajc4daz1rgp6g9hg75vh-backend-es-check-workspace.drv";
            assert workspace.outPath == "/nix/store/ikgclz97jpz52jy6fml1ivykv2kjnxdm-backend-es-check-workspace";
            assert workspace.drvPath == flake.checks.x86_64-darwin.build.src.drvPath;
            assert runtime.drvPath == "/nix/store/63h620l1ix5lx3ijm77mpncd7m6v2f42-purs-backend-es-runtime-1.4.3.drv";
            assert runtime.outPath == "/nix/store/msby1pbc9vxqhaa5v1x17dm4div23ijl-purs-backend-es-runtime-1.4.3";
            assert runtime.drvPath == packages.purs-backend-es.runtime.drvPath;
            assert alternative.drvPath == "/nix/store/glk3zzbg74y0mwgbdpjk72f3k48gvbsa-backend-es-check-workspace-rsync.drv";
            assert alternative.outPath == "/nix/store/zarmppcihh24d1v9zbl5s072c3r50hmb-backend-es-check-workspace-rsync";
            assert layout.drvPath == "/nix/store/p265fcqiswbfdcx8qibfjr0vjlx9v2kd-backend-es-check-layout.drv";
            assert layout.outPath == "/nix/store/0f10cafri71acn3gdlylbk7cn766z43n-backend-es-check-layout";
            assert pkgs.bashNonInteractive.outPath == "/nix/store/6sfr9nl8la7j1311dg61wz9dk0q3gxgk-bash-5.3p3";
            assert pkgs.coreutils.outPath == "/nix/store/m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9.8";
            assert pkgs.rsync.outPath == "/nix/store/5vsql2rnfzlxqxjac7d2v4cp79z9fyxg-rsync-3.4.1";
            assert pkgs.diffutils.outPath == "/nix/store/jh6w96g8g9xjdbcqm8lkrvxckplca0wc-diffutils-3.12";
            {
              sourceRef = "${{ github.ref }}";
              sourceSha = "${{ github.sha }}";
              runId = "${{ github.run_id }}";
              runAttempt = "${{ github.run_attempt }}";
              setup = "Cambridge-Vision-Technology/ci/setup@aa5e3d4010883a2796cc1f32a826f2cad6c4e3ac";
              original = declaration workspace;
              alternative = declaration alternative;
              immutableInput = declaration layout;
              runtime = declaration runtime;
              tools = builtins.mapAttrs (_: value: identity value // { inherit (value) version; }) {
                bash = pkgs.bashNonInteractive;
                inherit (pkgs) coreutils rsync diffutils;
              };
              nixpkgs = { inherit (flake.inputs.nixpkgs) rev outPath; };
            }
          ' > "${{ runner.temp }}/dev1073-darwin-diagnostic/declaration.json" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/declaration.stderr"

      - name: Record checked-out commit
        id: checkout_identity
        continue-on-error: true
        run: git rev-parse HEAD > "${{ runner.temp }}/dev1073-darwin-diagnostic/checkout-sha.txt" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/checkout-sha.stderr"

      - name: Record Nix client version
        id: nix_version
        continue-on-error: true
        run: nix --version > "${{ runner.temp }}/dev1073-darwin-diagnostic/nix-version.txt" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/nix-version.stderr"

      - name: Record the native host system
        id: host_system
        continue-on-error: true
        run: /usr/bin/uname -sm > "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-host-system.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-host-system.stderr"

      - name: Acquire only comparison tools without either workspace output
        id: tools
        if: ${{ !cancelled() && steps.declaration.outcome == 'success' }}
        continue-on-error: true
        run: >-
          /usr/bin/time -l -o "${{ runner.temp }}/dev1073-darwin-diagnostic/tools-client-time-rusage.txt"
          nix build --impure --no-link --print-out-paths --print-build-logs --log-format raw --expr
          'let flake = builtins.getFlake (toString ./.); pkgs = import flake.inputs.nixpkgs { system = "x86_64-darwin"; }; in [ pkgs.coreutils pkgs.diffutils pkgs.rsync ]'
          > "${{ runner.temp }}/dev1073-darwin-diagnostic/tools.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/tools.stderr"

      - name: Open UTC scope before both attempts and all native observations
        id: window_start
        if: ${{ !cancelled() && steps.declaration.outcome == 'success' }}
        run: |
          /bin/date -u '+start=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-window-start.txt"

      - name: Snapshot Nix daemon PIDs before build, without arguments
        id: daemon_before
        if: ${{ !cancelled() && steps.window_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/pgrep -l -x nix-daemon > "${{ runner.temp }}/dev1073-darwin-diagnostic/daemon-before.txt" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/daemon-before.stderr"

      - name: Snapshot exact Bash, cp, Coreutils or rsync PIDs before attempts, without arguments
        id: builder_before
        if: ${{ !cancelled() && steps.window_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/pgrep -f '^/nix/store/(6sfr9nl8la7j1311dg61wz9dk0q3gxgk-bash-5\.3p3/bin/bash|m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9\.8/bin/(cp|coreutils)|5vsql2rnfzlxqxjac7d2v4cp79z9fyxg-rsync-3\.4\.1/bin/rsync)( |$)' > "${{ runner.temp }}/dev1073-darwin-diagnostic/builder-before-pids.txt" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/builder-before-pids.stderr"

      - name: Observe memory before build, no pressure or simulation flags
        id: memory_before
        if: ${{ !cancelled() && steps.window_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/memory_pressure > "${{ runner.temp }}/dev1073-darwin-diagnostic/memory-before.txt" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/memory-before.stderr"

      - name: Open original attempt window
        id: original_start
        if: ${{ !cancelled() && steps.window_start.outcome == 'success' }}
        run: |
          /bin/date -u '+start=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/original-window-start.txt"

      - name: Attempt only the original exact workspace, timing the client not daemon builders
        id: original
        if: ${{ !cancelled() && steps.original_start.outcome == 'success' }}
        run: /usr/bin/time -l -o "${{ runner.temp }}/dev1073-darwin-diagnostic/original-client-time-rusage.txt" nix build --no-link --print-out-paths --print-build-logs --log-format raw .#packages.x86_64-darwin.diagnose-darwin-workspace > "${{ runner.temp }}/dev1073-darwin-diagnostic/original.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/original.stderr"

      - name: Close original attempt window even after failure
        id: original_end
        if: ${{ always() && steps.original.outcome != 'skipped' && steps.original_start.outcome == 'success' }}
        run: |
          /bin/date -u '+end=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/original-window-end.txt"

      - name: Open alternative attempt window independently of original outcome
        id: alternative_start
        if: ${{ !cancelled() && steps.declaration.outcome == 'success' && steps.window_start.outcome == 'success' }}
        run: |
          /bin/date -u '+start=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative-window-start.txt"

      - name: Attempt only the separate rsync workspace even if original failed
        id: alternative
        if: ${{ !cancelled() && steps.alternative_start.outcome == 'success' }}
        run: /usr/bin/time -l -o "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative-client-time-rusage.txt" nix build --no-link --print-out-paths --print-build-logs --log-format raw .#packages.x86_64-darwin.diagnose-workspace-rsync > "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative.stderr"

      - name: Close alternative attempt window even after failure
        id: alternative_end
        if: ${{ always() && steps.alternative.outcome != 'skipped' && steps.alternative_start.outcome == 'success' }}
        run: |
          /bin/date -u '+end=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative-window-end.txt"

      - name: Snapshot Nix daemon PIDs after build, without arguments
        id: daemon_after
        if: ${{ always() && steps.alternative_end.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/pgrep -l -x nix-daemon > "${{ runner.temp }}/dev1073-darwin-diagnostic/daemon-after.txt" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/daemon-after.stderr"

      - name: Snapshot exact Bash, cp, Coreutils or rsync PIDs after attempts, without arguments
        id: builder_after
        if: ${{ always() && steps.alternative_end.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/pgrep -f '^/nix/store/(6sfr9nl8la7j1311dg61wz9dk0q3gxgk-bash-5\.3p3/bin/bash|m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9\.8/bin/(cp|coreutils)|5vsql2rnfzlxqxjac7d2v4cp79z9fyxg-rsync-3\.4\.1/bin/rsync)( |$)' > "${{ runner.temp }}/dev1073-darwin-diagnostic/builder-after-pids.txt" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/builder-after-pids.stderr"

      - name: Observe memory after build, no pressure or simulation flags
        id: memory_after
        if: ${{ always() && steps.alternative_end.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/memory_pressure > "${{ runner.temp }}/dev1073-darwin-diagnostic/memory-after.txt" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/memory-after.stderr"

      - name: Open native comparison window after independent attempts
        id: parity_start
        if: ${{ always() && steps.window_start.outcome == 'success' }}
        run: |
          /bin/date -u '+start=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-parity-start.txt"

      - name: Compare alternative bytes and tree against original immutable input even if original failed
        id: input_diff
        if: ${{ always() && steps.parity_start.outcome == 'success' && steps.alternative.outcome == 'success' }}
        run: /usr/bin/time -l -o "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-diff-time-rusage.txt" /nix/store/jh6w96g8g9xjdbcqm8lkrvxckplca0wc-diffutils-3.12/bin/diff --recursive /nix/store/0f10cafri71acn3gdlylbk7cn766z43n-backend-es-check-layout/ /nix/store/zarmppcihh24d1v9zbl5s072c3r50hmb-backend-es-check-workspace-rsync/ > "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-input-diff.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-input-diff.stderr"

      - name: Retain independent immutable-input checksum type and permission changes without materialization chmod
        id: input_modes
        if: ${{ always() && steps.parity_start.outcome == 'success' && steps.alternative.outcome == 'success' }}
        run: /usr/bin/time -l -o "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-modes-time-rusage.txt" /nix/store/5vsql2rnfzlxqxjac7d2v4cp79z9fyxg-rsync-3.4.1/bin/rsync --recursive --copy-links --perms --checksum --dry-run --itemize-changes /nix/store/0f10cafri71acn3gdlylbk7cn766z43n-backend-es-check-layout/ /nix/store/zarmppcihh24d1v9zbl5s072c3r50hmb-backend-es-check-workspace-rsync/ > "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-input-mode-changes.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-input-mode-changes.stderr"

      - name: Assert the retained native change report is empty, not merely rsync exit zero
        id: input_modes_equal
        if: ${{ always() && steps.input_modes.outcome == 'success' }}
        run: /usr/bin/cmp /dev/null "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-input-mode-changes.stdout" > "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-input-mode-equality.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-input-mode-equality.stderr"

      - name: Retain actual alternative names types and executable modes
        id: alternative_tree
        if: ${{ always() && steps.alternative.outcome == 'success' }}
        run: nix store ls --recursive --long /nix/store/zarmppcihh24d1v9zbl5s072c3r50hmb-backend-es-check-workspace-rsync > "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-alternative-tree.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-alternative-tree.stderr"

      - name: Retain original immutable link-farm names types and modes
        id: input_tree
        if: ${{ always() && steps.alternative.outcome == 'success' }}
        run: nix store ls --recursive --long /nix/store/0f10cafri71acn3gdlylbk7cn766z43n-backend-es-check-layout > "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-input-tree.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-input-tree.stderr"

      - name: Retain dereferenced immutable input and actual alternative launcher and regular-file modes
        id: file_modes
        if: ${{ always() && steps.alternative.outcome == 'success' }}
        run: /nix/store/m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9.8/bin/stat --dereference --format='%n %F %a' /nix/store/0f10cafri71acn3gdlylbk7cn766z43n-backend-es-check-layout/backend-es/index.js /nix/store/zarmppcihh24d1v9zbl5s072c3r50hmb-backend-es-check-workspace-rsync/backend-es/index.js /nix/store/0f10cafri71acn3gdlylbk7cn766z43n-backend-es-check-layout/spago.yaml /nix/store/zarmppcihh24d1v9zbl5s072c3r50hmb-backend-es-check-workspace-rsync/spago.yaml > "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-file-modes.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-file-modes.stderr"

      - name: Hash actual original Darwin output only if realized
        id: original_hash
        if: ${{ always() && steps.original.outcome == 'success' }}
        run: nix hash path /nix/store/ikgclz97jpz52jy6fml1ivykv2kjnxdm-backend-es-check-workspace > "${{ runner.temp }}/dev1073-darwin-diagnostic/original.narhash" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/original-hash.stderr"

      - name: Hash actual alternative Darwin output independently
        id: alternative_hash
        if: ${{ always() && steps.alternative.outcome == 'success' }}
        run: nix hash path /nix/store/zarmppcihh24d1v9zbl5s072c3r50hmb-backend-es-check-workspace-rsync > "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative.narhash" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative-hash.stderr"

      - name: Directly compare both actual Darwin hashes, never a Linux expectation
        id: hashes_equal
        if: ${{ always() && steps.original_hash.outcome == 'success' && steps.alternative_hash.outcome == 'success' }}
        run: /usr/bin/cmp "${{ runner.temp }}/dev1073-darwin-diagnostic/original.narhash" "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative.narhash" > "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-hash-equality.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-hash-equality.stderr"

      - name: Close native comparison window even after individual failures
        id: parity_end
        if: ${{ always() && steps.parity_start.outcome == 'success' }}
        run: |
          /bin/date -u '+end=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-parity-end.txt"

      - name: Open native binary probe window after both attempts
        id: probe_start
        if: ${{ always() && steps.window_start.outcome == 'success' }}
        run: /bin/date -u '+start=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"

      - name: Resolve exact declared Bash image
        id: bash_resolved
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/realpath /nix/store/6sfr9nl8la7j1311dg61wz9dk0q3gxgk-bash-5.3p3/bin/bash > "${{ runner.temp }}/dev1073-darwin-diagnostic/bash-resolved.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/bash-resolved.stderr"

      - name: Resolve exact declared cp alias to its actual image
        id: cp_resolved
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/realpath /nix/store/m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9.8/bin/cp > "${{ runner.temp }}/dev1073-darwin-diagnostic/cp-resolved.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/cp-resolved.stderr"

      - name: Resolve exact declared rsync image
        id: rsync_resolved
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/realpath /nix/store/5vsql2rnfzlxqxjac7d2v4cp79z9fyxg-rsync-3.4.1/bin/rsync > "${{ runner.temp }}/dev1073-darwin-diagnostic/rsync-resolved.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/rsync-resolved.stderr"

      - name: Inspect exact rsync file type
        id: rsync_file
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/file -E -L /nix/store/5vsql2rnfzlxqxjac7d2v4cp79z9fyxg-rsync-3.4.1/bin/rsync > "${{ runner.temp }}/dev1073-darwin-diagnostic/rsync-file.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/rsync-file.stderr"

      - name: Inspect exact Bash file type
        id: bash_file
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/file -E -L /nix/store/6sfr9nl8la7j1311dg61wz9dk0q3gxgk-bash-5.3p3/bin/bash > "${{ runner.temp }}/dev1073-darwin-diagnostic/bash-file.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/bash-file.stderr"

      - name: Inspect exact cp alias file type
        id: cp_file
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/file -E -L /nix/store/m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9.8/bin/cp > "${{ runner.temp }}/dev1073-darwin-diagnostic/cp-file.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/cp-file.stderr"

      - name: Inspect exact Coreutils image file type
        id: coreutils_file
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/file -E -L /nix/store/m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9.8/bin/coreutils > "${{ runner.temp }}/dev1073-darwin-diagnostic/coreutils-file.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/coreutils-file.stderr"

      - name: Inspect exact Bash dynamic linkage
        id: bash_linkage
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/otool -L /nix/store/6sfr9nl8la7j1311dg61wz9dk0q3gxgk-bash-5.3p3/bin/bash > "${{ runner.temp }}/dev1073-darwin-diagnostic/bash-linkage.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/bash-linkage.stderr"

      - name: Inspect exact cp alias dynamic linkage
        id: cp_linkage
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/otool -L /nix/store/m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9.8/bin/cp > "${{ runner.temp }}/dev1073-darwin-diagnostic/cp-linkage.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/cp-linkage.stderr"

      - name: Inspect exact Coreutils image dynamic linkage
        id: coreutils_linkage
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/otool -L /nix/store/m63c78djvjc9106g3dr99sfh1m841f3a-coreutils-9.8/bin/coreutils > "${{ runner.temp }}/dev1073-darwin-diagnostic/coreutils-linkage.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/coreutils-linkage.stderr"

      - name: Display exact Bash code signature without modifying it
        id: bash_signature
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
        run: /usr/bin/codesign --display --verbose=4 /nix/store/6sfr9nl8la7j1311dg61wz9dk0q3gxgk-bash-5.3p3/bin/bash > "${{ runner.temp }}/dev1073-darwin-diagnostic/bash-signature.stdout" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/bash-signature.stderr"

      - name: Display exact cp alias code signature without modifying it
        id: cp_signature
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        continue-on-error: true
