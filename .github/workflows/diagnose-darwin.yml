            commands = "${{ steps.commands.outcome }}";
            nixFloor = "${{ steps.nix_floor.outcome }}";
            declaration = "${{ steps.declaration.outcome }}";
            checkoutIdentity = "${{ steps.checkout_identity.outcome }}";
            nixVersion = "${{ steps.nix_version.outcome }}";
            hostSystem = "${{ steps.host_system.outcome }}";
            tools = "${{ steps.tools.outcome }}";
            original = "${{ steps.original.outcome }}";
            originalStart = "${{ steps.original_start.outputs.start }}";
            originalStartOutcome = "${{ steps.original_start.outcome }}";
            originalEnd = "${{ steps.original_end.outputs.end }}";
            originalEndOutcome = "${{ steps.original_end.outcome }}";
            alternative = "${{ steps.alternative.outcome }}";
            alternativeStart = "${{ steps.alternative_start.outputs.start }}";
            alternativeStartOutcome = "${{ steps.alternative_start.outcome }}";
            alternativeEnd = "${{ steps.alternative_end.outputs.end }}";
            alternativeEndOutcome = "${{ steps.alternative_end.outcome }}";
            comparisonStart = "${{ steps.parity_start.outputs.start }}";
            comparisonStartOutcome = "${{ steps.parity_start.outcome }}";
            comparisonEnd = "${{ steps.parity_end.outputs.end }}";
            comparisonEndOutcome = "${{ steps.parity_end.outcome }}";
            inputDiff = "${{ steps.input_diff.outcome }}";
            inputModes = "${{ steps.input_modes.outcome }}";
            inputModesEqual = "${{ steps.input_modes_equal.outcome }}";
            inputTree = "${{ steps.input_tree.outcome }}";
            alternativeTree = "${{ steps.alternative_tree.outcome }}";
            fileModes = "${{ steps.file_modes.outcome }}";
            inputParity = "${{ steps.input_parity.outcome }}";
