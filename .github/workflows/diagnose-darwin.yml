      - name: Record native binary probe end even after individual failures
        id: probe_end
        if: ${{ always() && steps.probe_start.outcome == 'success' }}
        run: /bin/date -u '+end=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"

      - name: Close whole UTC scope after attempts comparisons and native probes
        id: window_end
        if: ${{ always() && steps.window_start.outcome == 'success' }}
        run: |
          /bin/date -u -v+1S '+end=%Y-%m-%d %H:%M:%S%z' >> "$GITHUB_OUTPUT"
          /bin/cp "$GITHUB_OUTPUT" "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-window-end.txt"

      - name: Read target-related termination and security records in the UTC window
