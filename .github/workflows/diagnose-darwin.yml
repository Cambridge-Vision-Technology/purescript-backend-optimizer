        if: ${{ always() && steps.original.outcome != 'skipped' && steps.declaration.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: nix log /nix/store/gxsnb1ijlh13ajc4daz1rgp6g9hg75vh-backend-es-check-workspace.drv > "${{ runner.temp }}/dev1073-darwin-diagnostic/original-build.log" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/original-build-log.stderr"

      - name: Retrieve only the alternative workspace build log including failure
        id: alternative_log
        if: ${{ always() && steps.alternative.outcome != 'skipped' && steps.declaration.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: nix log /nix/store/glk3zzbg74y0mwgbdpjk72f3k48gvbsa-backend-es-check-workspace-rsync.drv > "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative-build.log" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative-build-log.stderr"

      - name: Retain exact original target dependency runtime and immutable input derivations
        id: native_declarations
        if: ${{ always() && steps.declaration.outcome == 'success' }}
        continue-on-error: true
        run: nix derivation show .#packages.x86_64-darwin.diagnose-darwin-workspace .#packages.x86_64-darwin.diagnose-workspace-rsync .#packages.x86_64-darwin.diagnose-workspace-layout .#packages.x86_64-darwin.diagnose-darwin-runtime > "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-native-declarations.json" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/comparison-native-declarations.stderr"

      - name: Retain actual original output NAR registration only if realized
        id: original_info
        if: ${{ always() && steps.original.outcome == 'success' }}
        continue-on-error: true
        run: nix path-info --json --json-format 2 /nix/store/ikgclz97jpz52jy6fml1ivykv2kjnxdm-backend-es-check-workspace > "${{ runner.temp }}/dev1073-darwin-diagnostic/original-path-info.json" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/original-path-info.stderr"

      - name: Retain actual alternative output NAR registration independently
        id: alternative_info
        if: ${{ always() && steps.alternative.outcome == 'success' }}
        continue-on-error: true
        run: nix path-info --json --json-format 2 /nix/store/zarmppcihh24d1v9zbl5s072c3r50hmb-backend-es-check-workspace-rsync > "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative-path-info.json" 2> "${{ runner.temp }}/dev1073-darwin-diagnostic/alternative-path-info.stderr"

      - name: Require complete immutable-input byte tree and executable-mode evidence
        id: input_parity
        if: ${{ always() && steps.declaration.outcome == 'success' }}
        run: >-
          nix eval --json --expr '
          assert "${{ steps.input_diff.outcome }}" == "success";
          assert "${{ steps.input_modes_equal.outcome }}" == "success";
          assert "${{ steps.input_tree.outcome }}" == "success";
          assert "${{ steps.alternative_tree.outcome }}" == "success";
          assert "${{ steps.file_modes.outcome }}" == "success";
