name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: Cambridge-Vision-Technology/ci/.github/workflows/workflow.yml@fc4d47303294aa1a7c7b1b8fd4e44aaf70c4378b
    with:
      enable-org-read-access: false
      check-dev-shells: true
      enable-failure-diagnostics: true
      runner-map: |
        {
          "x86_64-linux": "ubuntu-24.04",
          "aarch64-linux": "ubuntu-24.04-arm",
          "x86_64-darwin": "macos-15-intel",
          "aarch64-darwin": "macos-15"
        }
