name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: Cambridge-Vision-Technology/ci/.github/workflows/workflow.yml@aa5e3d4010883a2796cc1f32a826f2cad6c4e3ac
    with:
      enable-org-read-access: false
      check-dev-shells: true
